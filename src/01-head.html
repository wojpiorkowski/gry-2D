<title>Kraina Gier 2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: słoneczny plac zabaw. Niebo u góry, trawa na dole, karty jak grube naklejki z „wypukłym” dołem.
   Jeden świadomy, jasny świat dla dzieci (bez trybu ciemnego), więc wszystkie kolory są ustawione jawnie. */
:root{
  --sky:#79c6ff; --sky-2:#d4efff; --sky-3:#eef8ff;
  --grass:#62c050; --grass-2:#43a137;
  --sun:#ffd23a; --coral:#ff6f61; --grape:#7a5cff; --mint:#1fbfa6;
  --ink:#1f2d47; --muted:#56657d; --card:#ffffff; --paper:#fffaf0; --line:#e7e2d4;
  --ok:#2fb35a; --bad:#ff5a5f;
  --mat:#ff8a3d; --pol:#e84a8a; --prz:#2fb35a; --ang:#3d8bff; --coop:#8e5cff;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px; --r-sm:14px;
  --shadow:0 6px 0 rgba(31,45,71,.12);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky-3);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(238,248,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid #d7ecfb}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--sky-3)}
.hdr .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo-badge{width:44px;height:44px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 4px 0 #e0ae10;color:var(--ink)}
.logo b{font-family:var(--display);font-size:22px;font-weight:800;display:block;line-height:1}
.logo small{color:var(--muted);font-weight:700;font-size:13px}
.hdr-sp{flex:1}
.hdr-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip-btn{border:0;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 #cfe3f3;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.chip-btn .cnt{background:var(--coral);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.me-chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:3px 12px 3px 3px;box-shadow:0 3px 0 #cfe3f3;font-weight:800}
.me-chip .mini{width:34px;height:40px}
@media (max-width:640px){.logo small{display:none}.chip-btn .lbl{display:none}.logo b{font-size:19px}}

/* ---------- buttons, cards ---------- */
.btn{border:0;border-radius:18px;padding:14px 22px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--grape);color:#fff;box-shadow:0 6px 0 #5a3fd6;transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5a3fd6}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #e0ae10}
.btn.sun:active{box-shadow:0 2px 0 #e0ae10}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 #139684}
.btn.coral{background:var(--coral);box-shadow:0 6px 0 #d94b3e}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d5dde8}
.btn.small{font-size:16px;padding:9px 14px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;background:#eef2f8;color:var(--ink)}
.sec-title{font-size:30px;margin-bottom:12px}
.lead{font-size:19px;color:var(--muted);max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input,.field select,.field textarea{border:3px solid #dbe3ee;border-radius:14px;padding:12px 14px;font-weight:700;background:#fff;min-width:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--grape);outline:none}
.err{color:#c2322f;font-weight:800;min-height:1.4em}
.note{background:#fff6d6;border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px}
.note.blue{background:#e6f3ff}
.link{background:none;border:0;padding:0;color:var(--grape);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- playground scene ("filmik") ---------- */
.scene{position:relative;height:clamp(230px,34vw,340px);border-radius:28px;overflow:hidden;background:linear-gradient(#79c6ff 0%, #b9e3ff 60%, #d4efff 100%);box-shadow:var(--shadow)}
.scene .sun{position:absolute;top:22px;right:8%;width:74px;height:74px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px rgba(255,210,58,.25),0 0 0 26px rgba(255,210,58,.12);animation:sunpulse 4s ease-in-out infinite}
@keyframes sunpulse{50%{box-shadow:0 0 0 16px rgba(255,210,58,.25),0 0 0 32px rgba(255,210,58,.1)}}
.cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:54px;height:54px;left:18px;top:-26px}.cloud::after{width:40px;height:40px;left:58px;top:-18px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1400px)}}
.hill{position:absolute;bottom:-60px;border-radius:50%}
.hill.h1{left:-10%;width:70%;height:180px;background:#86d46f}
.hill.h2{right:-15%;width:75%;height:200px;background:#74c95e}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(var(--grass),var(--grass-2))}
.pk{position:absolute;bottom:20px;width:clamp(54px,8.5%,92px);transform:translateX(-50%);z-index:2}
.pk .av{width:100%;height:auto;display:block}
.pk-name{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-weight:800;font-size:12px;background:#fff;border-radius:999px;padding:0 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.pk.walk{animation:pk-walk var(--t,9s) ease-in-out infinite alternate;animation-delay:var(--del,0s)}
@keyframes pk-walk{from{margin-left:0}to{margin-left:var(--dx,60px)}}
.pk.hop .av{animation:pk-hop 1.3s ease-in-out infinite;animation-delay:var(--del,0s)}
@keyframes pk-hop{0%,55%,100%{transform:translateY(0)}70%{transform:translateY(-26px)}}
.ball{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ff6f61 19% 100%);z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.kite{position:absolute;font-size:34px;z-index:1;animation:kite 6s ease-in-out infinite}
@keyframes kite{50%{transform:translate(20px,-14px) rotate(8deg)}}
.flutter{position:absolute;font-size:22px;animation:flutter 7s ease-in-out infinite;z-index:3}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-30px)}50%{transform:translate(120px,0)}75%{transform:translate(60px,20px)}100%{transform:translate(0,0)}}

/* ---------- avatar animation ---------- */
.av{overflow:visible}
.av .av-all{animation:av-bob 1.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:view-box;transform-origin:60px 192px}
@keyframes av-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.av .av-armR{animation:av-wave 3.2s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:view-box;transform-origin:88px 100px}
@keyframes av-wave{0%,62%,100%{transform:rotate(0)}70%{transform:rotate(-38deg)}78%{transform:rotate(-18deg)}86%{transform:rotate(-38deg)}}
.av .av-armL{animation:av-swing 1.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:view-box;transform-origin:32px 100px}
@keyframes av-swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.av .av-eyes{animation:av-blink 4.4s infinite;animation-delay:var(--d,0s);transform-box:view-box;transform-origin:60px 64px}
@keyframes av-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.av .av-tail{animation:av-swing 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:80px 150px}
.av .av-wings{animation:av-flap .5s ease-in-out infinite alternate;transform-box:view-box;transform-origin:60px 110px}
@keyframes av-flap{to{transform:scaleX(.82)}}
.av .av-light{animation:av-light 1s steps(2) infinite}
@keyframes av-light{50%{fill:#ffe066}}
.av.jump .av-all{animation:av-jump .75s ease-out}
.av.jump .av-armL{animation:av-armupL .75s ease-out}
.av.jump .av-armR{animation:av-armupR .75s ease-out}
@keyframes av-jump{0%{transform:translateY(0)}35%{transform:translateY(-36px)}62%{transform:translateY(0) scaleY(.94)}100%{transform:none}}
@keyframes av-armupL{20%,70%{transform:rotate(130deg)}}
@keyframes av-armupR{20%,70%{transform:rotate(-130deg)}}
.av.dance .av-all{animation:av-dance .8s ease-in-out infinite;animation-delay:var(--d,0s)}
.av.dance .av-armL{animation:av-armupL 1.6s ease-in-out infinite}
.av.dance .av-armR{animation:av-armupR 1.6s ease-in-out infinite .8s}
@keyframes av-dance{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-8px)}}
.av.oops .av-all{animation:av-shake .55s}
@keyframes av-shake{20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.av.walk .av-legL{animation:av-step .45s ease-in-out infinite alternate;transform-box:view-box;transform-origin:51px 140px}
.av.walk .av-legR{animation:av-step .45s ease-in-out infinite alternate-reverse;transform-box:view-box;transform-origin:69px 140px}
@keyframes av-step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- landing ---------- */
.hero{display:grid;gap:20px;padding-block:22px}
.hero h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.5px}
.hero h1 span{color:var(--coral)}
.hero-cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.cta-card{border:0;text-align:left;border-radius:var(--r);padding:20px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);background:#fff;transition:transform .1s}
.cta-card:hover{transform:translateY(-3px)}
.cta-card .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none}
.cta-card b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.cta-card span{color:var(--muted);font-weight:700;font-size:15px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gcard{border:0;text-align:left;background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--gc) 45%, #c8d2e0);display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .1s;min-width:0}
.gcard:hover{transform:translateY(-3px) rotate(-.5deg)}
.gcard .gi{width:58px;height:58px;border-radius:18px;background:color-mix(in srgb,var(--gc) 18%, #fff);display:grid;place-items:center;font-size:32px}
.gcard b{font-family:var(--display);font-size:21px;line-height:1.05}
.gcard .gd{color:var(--muted);font-weight:700;font-size:14px}
.gcard .gs{position:absolute;top:14px;right:14px;font-weight:800;font-size:12px;color:#fff;background:var(--gc);border-radius:999px;padding:2px 9px}
.gcard .best{font-size:14px;color:#e0a800;letter-spacing:1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:0;border-radius:999px;padding:7px 14px;font-weight:800;background:#fff;box-shadow:0 3px 0 #d5dde8}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
@media (max-width:560px){.games-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gcard{padding:12px}.gcard .gs{position:static;align-self:flex-start}.gcard b{font-size:18px}.pk-name{display:none}}
.banner button{margin-left:10px;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px}
footer.foot{padding-block:30px;color:var(--muted);font-size:14px}

/* ---------- auth ---------- */
.auth{max-width:560px;margin:26px auto;display:flex;flex-direction:column;gap:18px}
.auth h2{font-size:34px}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px}
.pin-label{font-family:var(--display);font-weight:800;font-size:22px;text-align:center}
.pin .dots{display:flex;gap:14px}
.pin .dots i{width:26px;height:26px;border-radius:50%;border:4px solid var(--grape);background:#fff;transition:background .15s, transform .15s}
.pin .dots i.on{background:var(--grape);transform:scale(1.1)}
.pin.shake .dots{animation:av-shake .5s}
.keys{display:grid;grid-template-columns:repeat(3,82px);gap:12px}
.keys button{height:72px;border:0;border-radius:20px;background:#fff;font-family:var(--display);font-weight:800;font-size:32px;box-shadow:0 6px 0 #cdd7e5}
.keys button:active{transform:translateY(4px);box-shadow:0 2px 0 #cdd7e5}
.keys button.k-ok{background:var(--mint);color:#fff;box-shadow:0 6px 0 #139684}
@media (max-width:400px){.keys{grid-template-columns:repeat(3,72px)}.keys button{height:64px}}
.steps-dots{display:flex;gap:8px}
.steps-dots i{flex:1;height:8px;border-radius:9px;background:#dbe3ee}
.steps-dots i.on{background:var(--mint)}
.code-input{font-family:var(--display)!important;font-size:34px!important;letter-spacing:12px;text-align:center}

/* ---------- avatar maker ---------- */
.maker{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px;padding-block:20px;align-items:start}
@media (max-width:820px){.maker{grid-template-columns:1fr}}
.stage{position:sticky;top:90px;border-radius:28px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%, #fff 0 30%, transparent 31%), var(--stage, #ffe7a8);box-shadow:var(--shadow);min-width:0}
@media (max-width:820px){.stage{position:relative;top:0}}
.stage .av{width:min(240px,70%);height:auto}
.stage h3{font-size:26px;margin-top:6px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{width:92px;height:92px;border-radius:18px;overflow:hidden;position:relative;background:#eef2f8;box-shadow:0 4px 0 #d5dde8}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:#fff;font-weight:800;line-height:1}
.ph-add{width:92px;height:92px;border-radius:18px;border:3px dashed #b9c6d8;display:grid;place-items:center;font-weight:800;color:var(--muted);background:#fff;font-size:14px;text-align:center;padding:6px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sty{border:0;border-radius:18px;padding:8px 6px 10px;background:var(--sb);box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;min-width:0}
.sty .av{width:64px;height:84px}
.sty[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d5dde8}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:0;border-radius:999px;padding:7px 13px;font-weight:800;background:#eef2f8}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ai-box{border-radius:18px;padding:14px;background:linear-gradient(135deg,#efe9ff,#e3f6ff);display:flex;flex-direction:column;gap:10px}
.ai-box .ai-out{font-weight:700;font-size:15px}
.magic{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(31,45,71,.55)}
.magic .card{text-align:center;max-width:420px;margin:16px}
.sparkle{font-size:56px;animation:spin 1.6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- child home ---------- */
.home-hero{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center;padding-block:20px}
@media (max-width:700px){.home-hero{grid-template-columns:1fr;text-align:center}.home-hero .row{justify-content:center}}
.home-av{border-radius:28px;background:var(--stage,#ffe7a8);padding:14px;text-align:center;box-shadow:var(--shadow)}
.home-av .av{width:170px;height:auto;max-width:100%}
.home-hero h1{font-size:clamp(34px,5vw,52px)}
.stat-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 14px;font-weight:800;box-shadow:0 4px 0 #d5dde8}
.stat-pill b{font-family:var(--display);font-size:22px}
.hw-card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hw-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.hw-head h3{font-size:24px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.node{position:relative;width:86px;height:86px;border-radius:50%;border:0;background:var(--gc);color:#fff;font-size:36px;box-shadow:0 7px 0 color-mix(in srgb,var(--gc) 70%, #000);display:grid;place-items:center}
.node.done{background:#ffd23a;box-shadow:0 7px 0 #e0ae10}
.node.locked{filter:grayscale(.2) opacity(.75)}
.node.next{animation:nodepulse 1.4s ease-in-out infinite}
@keyframes nodepulse{50%{transform:scale(1.07)}}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.node-wrap:nth-child(4n+2){transform:translateX(70px)}
.node-wrap:nth-child(4n+4){transform:translateX(-70px)}
.node-lbl{font-weight:800;font-size:13px;background:#fff;border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 #d5dde8;text-align:center;max-width:200px}
.node .ck{position:absolute;bottom:-6px;right:-6px;background:var(--ok);border-radius:50%;width:30px;height:30px;font-size:17px;display:grid;place-items:center;border:3px solid #fff}
.hw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ---------- game ---------- */
.game{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.game-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.game-title{font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.game-title small{font-family:var(--body);font-size:14px;color:#fff;background:var(--gc);border-radius:999px;padding:2px 10px}
.trail{position:relative;height:96px;background:linear-gradient(#d4efff,#d4efff 60%,var(--grass) 60%);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.trail .stones{position:absolute;left:6%;right:8%;bottom:14px;display:flex;justify-content:space-between}
.trail .stone{width:22px;height:12px;border-radius:50%;background:#e9e3cf;box-shadow:0 3px 0 #bdb59a}
.trail .stone.ok{background:var(--sun);box-shadow:0 3px 0 #e0ae10}
.trail .stone.bad{background:#ffc2c4;box-shadow:0 3px 0 #e59a9d}
.trail .goal{position:absolute;right:2%;bottom:12px;font-size:38px}
.trail .tav{position:absolute;bottom:14px;width:52px;transition:left .6s cubic-bezier(.5,1.6,.5,1);transform:translateX(-50%)}
.trail .tav .av{width:52px;height:auto}
.game-main{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:start}
